<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 问数</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f0f2f5; }
  #app { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; color: #333; }
  #mode { padding: 4px 8px; border: 1px solid #ccc; border-radius: 6px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 12px; max-width: 75%; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user { background: #4caf50; color: #fff; margin-left: auto; }
  .assistant { background: #fff; color: #333; border: 1px solid #e0e0e0; }
  .system { background: #fff8e1; color: #e65100; font-size: 13px; max-width: 90%; }
  .clarify { background: #e3f2fd; color: #1565c0; max-width: 90%; }
  .err { background: #ffebee; color: #c62828; }
  footer { background: #fff; padding: 12px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
  #input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  #send { padding: 10px 22px; background: #4caf50; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:disabled { background: #bdbdbd; cursor: not-allowed; }
  /* 配置 Tab + 数据源管理样式 */
  header nav { display: flex; gap: 6px; }
  .tab { padding: 4px 14px; background: #eee; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tab.active { background: #4caf50; color: #fff; }
  #chat-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }  /* 包住消息区+输入栏，保持原对话布局不塌 */
  #config-panel { flex: 1; overflow: auto; padding: 16px; }
  .cfg-layout { display: flex; gap: 16px; height: 100%; }
  .cfg-left { width: 30%; display: flex; flex-direction: column; gap: 8px; }
  .cfg-right { flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; overflow: auto; }
  #btn-new-ds { padding: 8px; background: #4caf50; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .ds-item { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; cursor: pointer; }
  .ds-item.selected { border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,0.2); }
  .ds-item b { font-size: 14px; }
  .ds-item span { color: #888; font-size: 12px; margin-left: 6px; }
  .ds-item button { margin-top: 6px; margin-right: 4px; padding: 3px 8px; font-size: 12px; border: 1px solid #ccc; background: #fafafa; border-radius: 4px; cursor: pointer; }
  .ds-item button:hover { background: #eee; }
  .table-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .table-row label { flex: 1; cursor: pointer; }
  .table-row .cmt { color: #888; font-size: 12px; flex: 1; }
  .table-row .expand { padding: 2px 8px; font-size: 12px; border: 1px solid #ccc; background: #fafafa; border-radius: 4px; cursor: pointer; }
  /* 表区卡片化 + 字段 inline 展开 + 勾选保存反馈 */
  .expand { padding: 5px 12px; font-size: 12px; border: 1px solid #4caf50; background: #fff; color: #4caf50; border-radius: 6px; cursor: pointer; }
  .expand:hover { background: #f5f5f5; }
  .table-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; transition: box-shadow .15s; }
  .table-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .table-card.expanded { border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,0.15); }
  .table-card-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
  .table-card-head label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .table-card-head .icon { font-size: 14px; }
  .table-card-head .tname { font-size: 13px; color: #222; }
  .table-card-head .kind-tag { font-size: 11px; color: #666; background: #f0f0f0; padding: 1px 6px; border-radius: 4px; }
  .table-card-head .cmt { flex: 1; color: #888; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save-tag { color: #4caf50; font-size: 12px; min-width: 56px; text-align: right; }
  .fields { padding: 0 12px 10px; }
  .field-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .field-table th, .field-table td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; }
  .field-table th { background: #fafafa; color: #555; font-weight: 600; }
  .field-table tbody tr:nth-child(even) { background: #fcfcfc; }   /* 斑马纹 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .modal-body { background: #fff; padding: 20px; border-radius: 10px; width: 360px; display: flex; flex-direction: column; gap: 8px; }
  .modal-body h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-body input, .modal-body select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .modal-body button { padding: 8px; border: none; border-radius: 6px; cursor: pointer; }
  #ds-save { background: #4caf50; color: #fff; }
  #ds-cancel { background: #eee; color: #333; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AI 问数</h1>
    <nav>
      <button id="tab-chat" class="tab active">对话</button>
      <button id="tab-config" class="tab">配置</button>
    </nav>
    <select id="mode"><option value="user">用户模式</option><option value="admin">管理员模式</option></select>
  </header>
  <div id="chat-panel">
    <div id="messages"></div>
    <footer>
      <input id="input" placeholder="输入问题，回车发送" autocomplete="off">
      <button id="send">发送</button>
    </footer>
  </div>
  <div id="config-panel" style="display:none">
    <div class="cfg-layout">
      <div class="cfg-left">
        <button id="btn-new-ds">+ 新建数据源</button>
        <div id="ds-list"></div>
      </div>
      <div class="cfg-right"><div id="tables-area">点左侧选数据源</div></div>
    </div>
  </div>
</div>
<div id="ds-modal" class="modal" style="display:none">
  <div class="modal-body">
    <h3 id="ds-modal-title">新建数据源</h3>
    <input id="ds-name" placeholder="名称">
    <select id="ds-type">
      <option value="starrocks">StarRocks</option>
      <option value="mysql">MySQL</option>
      <option value="pg">PostgreSQL</option>
    </select>
    <input id="ds-addr" placeholder="地址 host:port 如 10.0.0.1:9030">
    <input id="ds-db" placeholder="库名">
    <input id="ds-user" placeholder="用户名">
    <input id="ds-pwd" type="password" placeholder="密码">
    <button id="ds-save">保存</button>
    <button id="ds-cancel">取消</button>
  </div>
</div>
<script>
const USER_ID = "web-user";
let sessionId = null;
const msgs = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modeSel = document.getElementById("mode");

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const resp = await fetch(`/api/session?user_id=${USER_ID}&channel=web`, {method: "POST"});
  const data = await resp.json();
  if (!data.session_id) throw new Error("建会话失败：" + JSON.stringify(data));
  sessionId = data.session_id;
  return sessionId;
}

function parseSSE(text) {
  let type = "", dataStr = "";
  for (const line of text.split("\n")) {
    if (line.startsWith("event: ")) type = line.slice(7).trim();
    else if (line.startsWith("data: ")) dataStr += line.slice(6);
  }
  if (!type) return null;
  try { return {type, data: JSON.parse(dataStr).data}; }
  catch { return {type, data: {}}; }
}

async function ask(text) {
  const sid = await ensureSession();
  sendBtn.disabled = true;
  const bubble = addMsg("", "assistant");
  // 前端匀速打字队列：后端 chunk 粒度粗/间隔不均，前端逐字匀速吐，填平卡顿
  let queue = "", timer = null, streamDone = false, finalText = "", stopped = false;
  const TICK_MS = 38;  // 每字间隔（ms），约 26 字/秒；嫌快调大、嫌慢调小
  function step() {
    if (stopped) return;
    if (!queue) {                       // 队列空：停 tick；流已结束则用 done 的权威答案定稿
      clearInterval(timer); timer = null;
      if (streamDone && finalText) bubble.textContent = finalText;
      return;
    }
    // 动态速率：堆积多就加速（防长答案打太久），少就一字一字自然蹦
    const n = Math.max(1, Math.floor(queue.length / 60));  // 堆积超 60 字才加速，平时逐字
    bubble.textContent += queue.slice(0, n);
    queue = queue.slice(n);
  }
  function pushDelta(t) { if (!stopped) { queue += t; if (timer === null) timer = setInterval(step, TICK_MS); } }
  function finish(ans) { streamDone = true; finalText = ans; if (timer === null && !stopped) bubble.textContent = ans; }
  function stopTyper() { stopped = true; if (timer) { clearInterval(timer); timer = null; } }
  try {
    const resp = await fetch("/api/ask/sse", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: USER_ID, session_id: sid, text, mode: modeSel.value})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", got = false;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const evt = parseSSE(part);
        if (!evt) continue;
        got = true;
        if (evt.type === "answer_delta") pushDelta(evt.data.text || "");
        else if (evt.type === "done") finish(evt.data.answer || "");
        else if (evt.type === "clarification_needed") {
          stopTyper();
          bubble.remove();
          addMsg("🤔 需要补充：" + evt.data.question, "clarify");
        } else if (evt.type === "correction") {
          addMsg("已纠正：" + evt.data.original + " → " + evt.data.normalized, "system");
        } else if (evt.type === "error") {
          stopTyper();
          bubble.textContent = "⚠ " + (evt.data.message || "出错");
          bubble.className = "msg err";
        }
      }
    }
    if (!got) { stopTyper(); bubble.textContent = "（无回复）"; }
  } catch (e) {
    stopTyper();
    bubble.textContent = "⚠ 请求失败：" + e.message;
    bubble.className = "msg err";
  }
  sendBtn.disabled = false;
}

function onSend() {
  if (sendBtn.disabled) return;  // 发送中，防抖（拦重复回车/点击）
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg(text, "user");
  ask(text);
}

sendBtn.addEventListener("click", onSend);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onSend(); }
});

// ===== 配置页 Tab 切换 + 数据源管理 + 表勾选（plan Task 3）=====
function showTab(which) {
  const isChat = which === "chat";
  document.getElementById("chat-panel").style.display = isChat ? "flex" : "none";
  document.getElementById("config-panel").style.display = isChat ? "none" : "block";
  document.getElementById("tab-chat").classList.toggle("active", isChat);
  document.getElementById("tab-config").classList.toggle("active", !isChat);
  if (!isChat) loadDatasources();
}
document.getElementById("tab-chat").onclick = () => showTab("chat");
document.getElementById("tab-config").onclick = () => showTab("config");

let selectedDsId = null;
let editingDsId = null;

async function loadDatasources() {
  const r = await fetch("/api/admin/datasources");
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("加载数据源失败: " + (d.detail || r.status)); return; }
  const {datasources} = await r.json();
  const list = document.getElementById("ds-list");
  list.innerHTML = "";
  for (const ds of datasources) {
    const div = document.createElement("div");
    div.className = "ds-item" + (ds.id === selectedDsId ? " selected" : "");
    div.innerHTML = `<b>${ds.name}</b> <span>${ds.type}</span>
      <div>
        <button data-act="test">测试</button>
        <button data-act="sync">同步</button>
        <button data-act="edit">编辑</button>
        <button data-act="del">删除</button>
      </div>`;
    div.onclick = (e) => {
      if (e.target.tagName === "BUTTON") return;
      selectedDsId = ds.id; loadDatasources(); loadTables(ds.id);
    };
    div.querySelector('[data-act=test]').onclick = async () => {
      const rr = await fetch(`/api/admin/datasources/${ds.id}/test`, {method: "POST"});
      if (rr.ok) alert("连接成功");
      else { const d = await rr.json().catch(() => ({})); alert("连接失败: " + (d.detail || rr.status)); }
    };
    div.querySelector('[data-act=sync]').onclick = async (e) => {
      const btn = e.target;
      btn.disabled = true; btn.textContent = "同步中⏳...";
      const rr = await fetch(`/api/admin/datasources/${ds.id}/sync`, {method: "POST"});
      btn.disabled = false; btn.textContent = "同步";
      if (rr.ok) { const r = await rr.json(); alert(`同步完成：新增 ${r.added} / 更新 ${r.updated} / 跳过 ${r.skipped}`); loadTables(ds.id); }
      else { const d = await rr.json().catch(() => ({})); alert("同步失败: " + (d.detail || rr.status)); }
    };
    div.querySelector('[data-act=edit]').onclick = () => openDsModal(ds);
    div.querySelector('[data-act=del]').onclick = async () => {
      if (!confirm("删除数据源 " + ds.name + "?")) return;
      const rr = await fetch(`/api/admin/datasources/${ds.id}`, {method: "DELETE"});
      if (!rr.ok) { const d = await rr.json().catch(() => ({})); alert("删除失败: " + (d.detail || rr.status)); return; }
      if (selectedDsId === ds.id) {
        selectedDsId = null;
        document.getElementById("tables-area").innerHTML = "点左侧选数据源";
      }
      loadDatasources();
    };
    list.appendChild(div);
  }
}

function openDsModal(ds) {
  editingDsId = ds ? ds.id : null;
  document.getElementById("ds-modal-title").textContent = ds ? "编辑数据源" : "新建数据源";
  document.getElementById("ds-name").value = ds?.name ?? "";
  document.getElementById("ds-type").value = ds?.type || "starrocks";
  document.getElementById("ds-addr").value = ds ? `${ds.host}:${ds.port}` : "";
  document.getElementById("ds-db").value = ds?.db_name ?? "";
  document.getElementById("ds-user").value = ds?.username ?? "";
  document.getElementById("ds-pwd").value = "";
  document.getElementById("ds-modal").style.display = "flex";
}

document.getElementById("btn-new-ds").onclick = () => openDsModal(null);
document.getElementById("ds-cancel").onclick = () => document.getElementById("ds-modal").style.display = "none";
document.getElementById("ds-save").onclick = async () => {
  const [host, port] = document.getElementById("ds-addr").value.trim().split(":");
  const body = {
    name: document.getElementById("ds-name").value.trim(),
    type: document.getElementById("ds-type").value,
    host: (host || "").trim(),
    port: parseInt(port) || 9030,
    db_name: document.getElementById("ds-db").value.trim(),
    username: document.getElementById("ds-user").value.trim(),
    // 不发 sync_scope：后端默认 None=全部业务表，同步自动过滤系统库
  };
  const pwd = document.getElementById("ds-pwd").value;
  if (!body.name || !body.host || !body.db_name || !body.username) { alert("名称/地址/库/用户名必填"); return; }
  let r;
  if (editingDsId) {
    if (pwd) body.password = pwd;   // 编辑时空密码=不改
    r = await fetch(`/api/admin/datasources/${editingDsId}`, {
      method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  } else {
    if (!pwd) { alert("新建必须填密码"); return; }
    body.password = pwd;
    r = await fetch("/api/admin/datasources", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  }
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("保存失败: " + (d.detail || r.status)); return; }
  document.getElementById("ds-modal").style.display = "none";
  loadDatasources();
};

async function loadTables(dsId) {
  const r = await fetch(`/api/admin/metadata?datasource_id=${dsId}`);
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("加载表失败: " + (d.detail || r.status)); return; }
  const {tables} = await r.json();
  const area = document.getElementById("tables-area");
  // 顶部：标题 + 搜索框 + 同步按钮（搜索 oninput 时只重渲染卡片，不重建这块）
  area.innerHTML = `<h3 style="margin:0 0 8px;font-size:14px;">勾选要参与问数的表</h3>
    <input id="table-search" placeholder="搜索表名/注释…" style="width:100%;padding:7px 10px;margin:0 0 8px;border:1px solid #d0d0d0;border-radius:6px;font-size:13px;">
    <button class="expand" onclick="syncDs()" style="margin-bottom:10px;">同步元数据</button>
    <div id="table-list"></div>`;
  if (!tables.length) {
    document.getElementById("table-list").innerHTML = "<p style='color:#888;'>点「同步元数据」拉取表，然后勾选要问数的</p>";
    return;
  }
  const search = document.getElementById("table-search");
  search.oninput = () => renderTables(tables, search.value, document.getElementById("table-list"));
  renderTables(tables, "", document.getElementById("table-list"));
}

function renderTables(tables, q, container) {
  // 按 q 过滤表名/注释，大小写不敏感
  const ql = q.trim().toLowerCase();
  const list = tables.filter(t => !ql || (t.table_name + " " + (t.table_comment || "")).toLowerCase().includes(ql));
  container.innerHTML = "";
  if (!list.length) {
    container.innerHTML = "<p style='color:#888;'>无匹配表</p>";
    return;
  }
  for (const t of list) {
    const card = document.createElement("div");
    card.className = "table-card";
    const icon = t.kind === "view" ? "👁" : "📋";
    const kindLabel = t.kind === "view" ? "视图" : "表";
    card.innerHTML = `
      <div class="table-card-head">
        <label>
          <input type="checkbox" ${t.enabled ? "checked" : ""}>
          <span class="icon">${icon}</span>
          <b class="tname">${t.table_name}</b>
          <span class="kind-tag">${kindLabel}</span>
        </label>
        <span class="cmt">${t.table_comment || ""}</span>
        <span class="save-tag"></span>
      </div>`;
    const cb = card.querySelector("input");
    const tag = card.querySelector(".save-tag");
    cb.onchange = async () => {
      const rr = await fetch(`/api/admin/metadata/tables/${t.id}`, {
        method: "PUT", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({enabled: cb.checked})});
      if (rr.ok) {
        // 行尾闪现「✓ 已保存」500ms
        tag.textContent = "✓ 已保存";
        setTimeout(() => tag.textContent = "", 500);
      } else {
        cb.checked = !cb.checked;
        const d = await rr.json().catch(() => ({}));
        alert("保存失败: " + (d.detail || rr.status));
      }
    };
    // 点卡片头部展开/收起字段（checkbox 自己处理点击，不触发 toggle）
    card.querySelector(".table-card-head").onclick = (e) => {
      if (e.target === cb) return;
      toggleFields(card, t);
    };
    container.appendChild(card);
  }
}

function toggleFields(card, t) {
  const exist = card.querySelector(".fields");
  if (exist) { exist.remove(); card.classList.remove("expanded"); return; }
  card.classList.add("expanded");
  const f = document.createElement("div");
  f.className = "fields";
  if (!t.columns || !t.columns.length) {
    f.innerHTML = "<p style='color:#888;margin:4px 0;'>无字段信息（先同步元数据）</p>";
  } else {
    f.innerHTML = "<table class='field-table'>" +
      "<thead><tr><th>字段</th><th>类型</th><th>注释</th></tr></thead><tbody>" +
      t.columns.map(c => `<tr><td>${c.column_name}</td><td>${c.data_type || ""}</td><td>${c.column_comment || ""}</td></tr>`).join("") +
      "</tbody></table>";
  }
  card.appendChild(f);
}

async function syncDs() {
  if (!selectedDsId) return;
  const area = document.getElementById("tables-area");
  const hint = document.createElement("p");
  hint.textContent = "⏳ 同步中，拉表+视图+字段，表多可能要几十秒…";
  area.prepend(hint);
  const rr = await fetch(`/api/admin/datasources/${selectedDsId}/sync`, {method: "POST"});
  if (rr.ok) { loadTables(selectedDsId); }
  else { hint.remove(); const d = await rr.json().catch(() => ({})); alert("同步失败: " + (d.detail || rr.status)); }
}
</script>
</body>
</html>
