<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 问数</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f0f2f5; }
  #app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; color: #333; }
  #mode { padding: 4px 8px; border: 1px solid #ccc; border-radius: 6px; }
  /* 对话区 */
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 12px; max-width: 75%; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user { background: #4caf50; color: #fff; margin-left: auto; }
  .assistant { background: #fff; color: #333; border: 1px solid #e0e0e0; }
  .system { background: #fff8e1; color: #e65100; font-size: 13px; max-width: 90%; }
  .clarify { background: #e3f2fd; color: #1565c0; max-width: 90%; }
  .err { background: #ffebee; color: #c62828; }
  footer { background: #fff; padding: 12px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
  #input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  #send { padding: 10px 22px; background: #4caf50; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:disabled { background: #bdbdbd; cursor: not-allowed; }
  #stop { padding: 10px 22px; background: #e53935; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  /* Tab */
  header nav { display: flex; gap: 6px; }
  .tab { padding: 4px 14px; background: #eee; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tab.active { background: #4caf50; color: #fff; }
  /* 会话侧边栏 */
  #chat-panel { display: flex; flex: 1; }
  #session-sidebar { width: 220px; border-right: 1px solid #e0e0e0; background: #fafafa; display: flex; flex-direction: column; min-height: 0; }
  .sb-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #e8e8e8; font-size: 13px; color: #666; font-weight: 600; }
  #new-session { background: #fff; color: #4caf50; border: 1px solid #4caf50; border-radius: 4px; cursor: pointer; font-size: 16px; width: 24px; height: 22px; line-height: 1; }
  #new-session:hover { background: #f1f8f1; }
  #session-list { list-style: none; margin: 0; padding: 4px; overflow-y: auto; flex: 1; }
  .sess-item { padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #333; display: flex; align-items: center; gap: 4px; position: relative; }
  .sess-item:hover { background: #ececec; }
  .sess-item.active { background: #e3f2fd; color: #1565c0; }
  .sess-item .s-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-item .s-del { display: none; background: none; border: none; color: #c62828; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .sess-item:hover .s-del { display: inline; }
  .sess-item .s-edit { display: none; background: none; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 0 2px; }
  .sess-item:hover .s-edit { display: inline; }
  #chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #chat-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #config-panel { flex: 1; min-height: 0; overflow: auto; padding: 12px; }

  /* ===== 配置页：三栏 DB 工具风格 ===== */
  .cfg-layout {
    display: grid;
    grid-template-columns: 22% 33% 1fr;   /* 左数据源树 / 中表视图 / 右字段 */
    gap: 1px;
    background: #e0e0e0;                   /* gap 作分隔线 */
    height: 100%;
    border: 1px solid #d0d0d0;
    border-radius: 6px;
    min-width: 900px;                      /* ponytail: 窄屏横滚兜底，不做响应式断点 */
  }
  .cfg-col { background: #fff; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cfg-col-head {
    padding: 8px 10px;
    border-bottom: 1px solid #e8e8e8;
    background: #fafafa;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
  }
  .cfg-col-body { flex: 1; overflow-y: auto; padding: 6px; }

  /* 左栏：数据源 + 库折叠树 */
  .cfg-left .cfg-col-head { justify-content: space-between; padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
  .cfg-left .cfg-col-head > span { font-size: 13px; color: #666; font-weight: 600; }
  .cfg-head-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  #btn-new-ds { padding: 5px 10px; background: #4caf50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #btn-new-ds:hover { background: #43a047; }
  .ds-item { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; transition: all .12s; }
  .ds-item:hover { background: #f7f7f7; }
  .ds-item.selected { border-color: #4caf50; background: #f1f8f1; box-shadow: 0 0 0 2px rgba(76,175,80,0.12); }
  .ds-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .ds-row b { font-size: 13px; color: #222; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ds-row .type-tag { font-size: 11px; color: #666; background: #f0f0f0; padding: 1px 6px; border-radius: 3px; }
  .ds-toggle { font-size: 11px; color: #888; cursor: pointer; user-select: none; padding: 0 4px; }
  .ds-actions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .ds-actions button { padding: 2px 6px; font-size: 11px; border: 1px solid #ccc; background: #fafafa; border-radius: 3px; cursor: pointer; }
  .ds-actions button:hover { background: #eee; }
  /* 库列表（嵌套在 ds-item 下） */
  .schema-list { margin-top: 6px; padding-left: 14px; border-left: 2px solid #e8e8e8; margin-left: 4px; }
  .schema-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: #444; }
  .schema-item:hover { background: #f0f7ff; }
  .schema-item.selected { background: #e3f2fd; color: #1565c0; font-weight: 600; }
  .schema-item .s-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .schema-placeholder { font-size: 11px; color: #aaa; padding: 4px 6px; }

  /* 中栏：表/视图分栏 */
  .cfg-mid .cfg-col-head { flex-direction: column; align-items: stretch; padding: 8px 10px; gap: 6px; }
  .mid-row { display: flex; align-items: center; gap: 6px; }
  #mid-title { font-size: 13px; font-weight: 600; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind-tabs { display: flex; gap: 4px; }
  .kind-tab { padding: 3px 10px; font-size: 12px; border: 1px solid #ccc; background: #fafafa; border-radius: 4px; cursor: pointer; color: #555; }
  .kind-tab.active { background: #4caf50; color: #fff; border-color: #4caf50; }
  #btn-sync { padding: 4px 10px; font-size: 12px; border: 1px solid #4caf50; background: #fff; color: #4caf50; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  #btn-sync:hover { background: #f1f8f1; }
  #btn-sync:disabled { opacity: 0.6; cursor: not-allowed; }
  #btn-dashboard { padding: 4px 10px; font-size: 12px; border: 1px solid #1976d2; background: #fff; color: #1976d2; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  #btn-dashboard:hover { background: #e3f2fd; }
  #table-search { width: 100%; padding: 5px 8px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 12px; }

  .table-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    font-size: 13px;
    border-left: 3px solid transparent;
  }
  .table-row:hover { background: #f5f5f5; }
  .table-row.selected { background: #e8f5e9; border-left-color: #4caf50; }
  .table-row .checkbox { display: flex; align-items: center; cursor: pointer; }
  .table-row .icon { font-size: 13px; }
  .table-row .tname { font-weight: 500; color: #222; }
  .table-row .cmt { color: #999; font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-row .save-tag { color: #4caf50; font-size: 11px; min-width: 50px; text-align: right; }

  /* 右栏：字段表 */
  .cfg-right .cfg-col-head { justify-content: space-between; padding: 8px 12px; }
  #fields-title { font-size: 13px; font-weight: 600; color: #333; }
  #fields-count { font-size: 12px; color: #888; }

  .field-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .field-table th {
    background: #4a5568;                  /* 深色表头，DB 工具感 */
    color: #fff;
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .field-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
  .field-table tbody tr:nth-child(even) { background: #fafafa; }   /* 斑马纹 */
  .field-table tbody tr:hover { background: #e3f2fd; }              /* hover 高亮 */
  .field-table .col-name { width: 30%; font-family: Menlo, Monaco, monospace; color: #1a202c; }
  .field-table .col-type { width: 20%; color: #555; font-family: Menlo, Monaco, monospace; font-size: 12px; }

  .placeholder { color: #888; font-size: 13px; padding: 20px 10px; text-align: center; }
  .placeholder.err { color: #c62828; }
  .sync-flash { color: #4caf50; font-size: 12px; padding: 4px 8px; margin: 0 0 4px; background: #f1f8f1; border-radius: 3px; }

  /* Dashboard modal（总览） */
  .dash-body { background: #fff; padding: 16px 20px; border-radius: 10px; width: 720px; max-height: 80vh; overflow-y: auto; }
  .dash-body h3 { margin: 0 0 10px; font-size: 16px; }
  .dash-ds { border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px; }
  .dash-ds-head { background: #f5f5f5; padding: 6px 10px; font-weight: 600; font-size: 13px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 6px; align-items: center; }
  .dash-ds-head .tag { font-size: 11px; color: #666; background: #fff; padding: 1px 6px; border-radius: 3px; border: 1px solid #ddd; }
  .dash-schema { padding: 6px 10px 6px 20px; border-bottom: 1px solid #f0f0f0; }
  .dash-schema:last-child { border-bottom: none; }
  .dash-schema-head { font-size: 12px; color: #555; font-weight: 600; margin-bottom: 4px; }
  .dash-table { font-size: 12px; color: #333; padding: 2px 0 2px 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 3px; }
  .dash-table:hover { background: #e3f2fd; color: #1565c0; }
  .dash-table .icon { font-size: 11px; }
  .dash-table.enabled { color: #2e7d32; }
  .dash-table .check { font-size: 11px; color: #4caf50; }
  .dash-table .goto-tag { margin-left: auto; font-size: 10px; color: #1976d2; opacity: 0; transition: opacity .15s; }
  .dash-table:hover .goto-tag { opacity: 1; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .modal-body { background: #fff; padding: 20px; border-radius: 10px; width: 360px; display: flex; flex-direction: column; gap: 8px; }
  .modal-body h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-body input, .modal-body select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .modal-body button { padding: 8px; border: none; border-radius: 6px; cursor: pointer; }
  #ds-save { background: #4caf50; color: #fff; }
  #ds-cancel { background: #eee; color: #333; }
  /* assistant 消息内 markdown 样式 */
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant li { margin: 2px 0; line-height: 1.6; }
  .msg.assistant p { margin: 6px 0; }
  .msg.assistant p:first-child { margin-top: 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant code { background: #f5f5f5; padding: 1px 5px; border-radius: 3px; font-family: Menlo, Monaco, monospace; font-size: 13px; }
  .msg.assistant strong { font-weight: 600; }
  /* SQL 折叠区（默认隐藏，点按钮展开） */
  .sql-wrap { margin-top: 8px; }
  .sql-toggle { background: #fff; color: #1565c0; border: 1px solid #90caf9; border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .sql-toggle:hover { background: #e3f2fd; }
  /* assistant 气泡分区：思考/答案/表格 互不覆盖 */
  .msg-thought { font-size: 12px; color: #888; background: #fafafa; border-left: 3px solid #ddd; padding: 6px 10px; margin-bottom: 8px; white-space: pre-wrap; display: none; border-radius: 0 4px 4px 0; }
  .msg-answer { line-height: 1.6; }
  .msg-table { margin-top: 8px; overflow-x: auto; }
  .msg-table table { border-collapse: collapse; font-size: 13px; width: 100%; }
  .msg-table th { background: #4a5568; color: #fff; padding: 6px 10px; text-align: left; position: sticky; top: 0; }
  .msg-table td { padding: 5px 10px; border-bottom: 1px solid #eee; }
  .msg-table tbody tr:nth-child(even) { background: #fafafa; }
  .sql-wrap { margin-top: 6px; }
  .sql-code { background: #2d2d2d; color: #e6e6e6; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  .sql-code { background: #1e1e1e; color: #d4d4d4; padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-family: Menlo, Monaco, monospace; font-size: 12px; line-height: 1.5; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AI 问数</h1>
    <nav>
      <button id="tab-chat" class="tab active">对话</button>
      <button id="tab-config" class="tab">配置</button>
    </nav>
    <select id="mode"><option value="user">用户模式</option><option value="admin">管理员模式</option></select>
  </header>
  <div id="chat-panel" style="display:flex">
    <aside id="session-sidebar">
      <div class="sb-head">
        <span>会话</span>
        <button id="new-session" title="新建会话">+</button>
      </div>
      <ul id="session-list"></ul>
    </aside>
    <div id="chat-main">
      <div id="messages"></div>
      <footer>
        <input id="input" placeholder="输入问题，回车发送" autocomplete="off">
        <button id="send">发送</button>
        <button id="stop" hidden>停止</button>
      </footer>
    </div>
  </div>
  <div id="config-panel" style="display:none">
    <div class="cfg-layout">
      <!-- 左栏：数据源 > 库 折叠树（刷新/总览在数据源顶层，不属具体库） -->
      <div class="cfg-col cfg-left">
        <div class="cfg-col-head">
          <span>数据源</span>
          <div class="cfg-head-actions">
            <button id="btn-sync">刷新</button>
            <button id="btn-dashboard">总览</button>
            <button id="btn-new-ds">+ 新建</button>
          </div>
        </div>
        <div id="ds-list" class="cfg-col-body"></div>
      </div>
      <!-- 中栏：表/视图分栏（标题 + tab + 搜索） -->
      <div class="cfg-col cfg-mid">
        <div class="cfg-col-head">
          <div class="mid-row">
            <span id="mid-title">表（选库）</span>
            <div class="kind-tabs">
              <button class="kind-tab active" data-kind="table">表</button>
              <button class="kind-tab" data-kind="view">视图</button>
            </div>
          </div>
          <input id="table-search" placeholder="搜索表名/注释…">
        </div>
        <div id="tables-area" class="cfg-col-body"></div>
      </div>
      <!-- 右栏：字段表 -->
      <div class="cfg-col cfg-right">
        <div class="cfg-col-head">
          <span id="fields-title">字段</span>
          <span id="fields-count"></span>
        </div>
        <div id="fields-area" class="cfg-col-body"><p class="placeholder">点左侧表查看字段</p></div>
      </div>
    </div>
  </div>
</div>
<div id="ds-modal" class="modal" style="display:none">
  <div class="modal-body">
    <h3 id="ds-modal-title">新建数据源</h3>
    <input id="ds-name" placeholder="名称">
    <select id="ds-type">
      <option value="starrocks">StarRocks</option>
      <option value="mysql">MySQL</option>
      <option value="pg">PostgreSQL</option>
    </select>
    <input id="ds-addr" placeholder="地址 host:port 如 10.0.0.1:9030">
    <input id="ds-db" placeholder="默认库（可选，留空连实例多库导航）">
    <input id="ds-user" placeholder="用户名">
    <input id="ds-pwd" type="password" placeholder="密码">
    <button id="ds-save">保存</button>
    <button id="ds-cancel">取消</button>
  </div>
</div>
<div id="dash-modal" class="modal" style="display:none">
  <div class="dash-body">
    <h3>总览 — 数据源 / 库 / 勾选表</h3>
    <div id="dash-content"></div>
    <button id="dash-close" style="margin-top:12px;padding:8px;background:#eee;border:none;border-radius:6px;cursor:pointer;width:100%">关闭</button>
  </div>
</div>
<script>
const USER_ID = "web-user";
let sessionId = null;
const msgs = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");
const modeSel = document.getElementById("mode");
const sessionList = document.getElementById("session-list");
const newSessionBtn = document.getElementById("new-session");

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const resp = await fetch(`/api/session?user_id=${USER_ID}&channel=web`, {method: "POST"});
  const data = await resp.json();
  if (!data.session_id) throw new Error("建会话失败：" + JSON.stringify(data));
  sessionId = data.session_id;
  await refreshSessionList();
  return sessionId;
}

// 会话列表渲染成侧边栏项：标题+改名+删除按钮。
async function refreshSessionList() {
  try {
    const r = await fetch(`/api/session?user_id=${USER_ID}`);
    if (!r.ok) return;
    const {sessions} = await r.json();
    sessionList.innerHTML = "";
    if (!sessions.length) {
      const li = document.createElement("li");
      li.className = "placeholder";
      li.style.padding = "8px";
      li.textContent = "暂无会话";
      sessionList.appendChild(li);
      return;
    }
    for (const s of sessions) {
      const li = document.createElement("li");
      li.className = "sess-item" + (s.id === sessionId ? " active" : "");
      li.dataset.id = s.id;
      const title = s.title || `（未命名 ${s.created_at ? new Date(s.created_at).toLocaleString("zh-CN") : ""}）`;
      const statusTag = s.status === "awaiting_clarification" ? " ·待补充" : "";
      li.innerHTML = `<span class="s-title">${escapeHtml(title)}</span>
        <button class="s-edit" title="改名">✎</button>
        <button class="s-del" title="删除">×</button>`;
      const titleEl = li.querySelector(".s-title");
      titleEl.textContent = title + statusTag;
      li.onclick = (e) => {
        if (e.target.closest(".s-del") || e.target.closest(".s-edit")) return;
        switchSession(s.id);
      };
      li.querySelector(".s-del").onclick = async (e) => {
        e.stopPropagation();
        if (!confirm("删除该会话？")) return;
        await fetch(`/api/session/${s.id}`, {method: "DELETE"});
        if (s.id === sessionId) {
          sessionId = null;
          msgs.innerHTML = "";
        }
        await refreshSessionList();
      };
      li.querySelector(".s-edit").onclick = (e) => {
        e.stopPropagation();
        const cur = titleEl.textContent.replace(/ ·待补充$/, "");
        const np = prompt("重命名会话：", cur);
        if (np && np.trim()) renameSession(s.id, np.trim());
      };
      sessionList.appendChild(li);
    }
  } catch {}
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function renameSession(sid, title) {
  const r = await fetch(`/api/session/${sid}`, {
    method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({title})});
  if (r.ok) await refreshSessionList();
  else { const d = await r.json().catch(()=>({})); alert("改名失败: " + (d.detail || r.status)); }
}

// 切换会话：清空对话区 + 加载该会话历史消息
async function switchSession(sid) {
  if (sid === sessionId) return;
  sessionId = sid;
  msgs.innerHTML = "";
  try {
    const r = await fetch(`/api/session/${sid}/messages`);
    if (r.ok) {
      const {messages} = await r.json();
      for (const m of messages) addMsg(m.content, m.role);
    }
  } catch {}
  await refreshSessionList();
}

function parseSSE(text) {
  let type = "", dataStr = "";
  for (const line of text.split("\n")) {
    if (line.startsWith("event: ")) type = line.slice(7).trim();
    else if (line.startsWith("data: ")) dataStr += line.slice(6);
  }
  if (!type) return null;
  try { return {type, data: JSON.parse(dataStr).data}; }
  catch { return {type, data: {}}; }
}

async function ask(text) {
  const sid = await ensureSession();
  sendBtn.disabled = true;
  stopBtn.hidden = false;          // 发送中显示停止键
  const bubble = addMsg("", "assistant");
  // 前端匀速打字队列：后端 chunk 粒度粗/间隔不均，前端逐字匀速吐，填平卡顿
  let queue = "", timer = null, streamDone = false, finalText = "", stopped = false;
  let traceId = null, cancelDone = false;
  // AbortController：前端取消优先断流（立即停 reader.read），同时 POST /cancel 置后端 token。
  const ac = new AbortController();
  const TICK_MS = 12;
  let raw = "";
  // 气泡分区：thought（思考过程）/ answer（答案文本，打字机+md）/ result-table（表格）/ sql 区
  // 各区独立 DOM 子节点，finish 的 renderMarkdown 只作用于 answer，不覆盖其他区。
  const thoughtEl = document.createElement("div"); thoughtEl.className = "msg-thought";
  const answerEl = document.createElement("div"); answerEl.className = "msg-answer";
  const tableEl = document.createElement("div"); tableEl.className = "msg-table";
  bubble.append(thoughtEl, answerEl, tableEl);
  // 收集本轮 execute_sql 的 SQL（可能多段），done 后在答案下挂折叠按钮默认隐藏。
  const sqls = [];
  function step() {
    if (stopped) return;
    if (!queue) {                       // 队列空：停 tick；流已结束则用 finalText 全文渲染 md
      clearInterval(timer); timer = null;
      if (streamDone) { const f = finalText || raw; if (f) renderMarkdown(answerEl, f); }
      return;
    }
    // 动态速率：堆积多就加速，最少吐 5 字/拍；队列见底时直接全吐（防打字机拖尾）
    const n = Math.max(5, Math.floor(queue.length / 30));
    raw += queue.slice(0, n);
    answerEl.textContent = raw;
    queue = queue.slice(n);
  }
  function pushDelta(t) { if (!stopped) { queue += t; if (timer === null) timer = setInterval(step, TICK_MS); } }
  function finish(ans) {
    streamDone = true; finalText = ans || raw;   // 兜底：done 无 answer 用已流式文本
    if (timer === null && !stopped && finalText) renderMarkdown(answerEl, finalText);
  }
  function stopTyper() { stopped = true; if (timer) { clearInterval(timer); timer = null; } }
  async function doStop() {
    if (!traceId || cancelDone) return;
    cancelDone = true;
    // 双管齐下：AbortController 立即断 reader.read（前端流即停），
    // + POST /cancel 置后端 CancelToken（loop 下一检查点停止生成）。
    try { ac.abort(); } catch {}
    try { await fetch(`/api/ask/cancel?trace_id=${traceId}`, {method: "POST"}); } catch {}
  }
  stopBtn.onclick = doStop;
  try {
    const resp = await fetch("/api/ask/sse", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: USER_ID, session_id: sid, text, mode: modeSel.value}),
      signal: ac.signal   // 取消时 abort() 立即断流
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", got = false;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const evt = parseSSE(part);
        if (!evt) continue;
        if (evt.data && evt.data.trace_id) traceId = evt.data.trace_id;  // 首个事件拿 trace_id 供取消
        got = true;
        if (evt.type === "answer_delta") pushDelta(evt.data.text || "");
        else if (evt.type === "tool_call" && evt.data.name === "execute_sql") {
          // 收集执行的 SQL，done 后在答案下挂折叠按钮（默认隐藏）。
          const sql = evt.data.args && evt.data.args.sql;
          if (sql) sqls.push(sql);
          // 思考过程：调了啥工具，往 thought 区写一行
          if (thoughtEl.textContent) thoughtEl.textContent += "\n";
          thoughtEl.textContent += `▸ 调用 ${evt.data.name}`;
          if (sql) thoughtEl.textContent += `：${sql.length > 60 ? sql.slice(0,60)+"…" : sql}`;
          thoughtEl.style.display = "block";
        }
        else if (evt.type === "tool_result") {
          // 工具返回：思考区补一行结果摘要；带 result_id 的拉表格渲染到 table 区
          const sum = evt.data.summary || "";
          if (sum) { if (thoughtEl.textContent) thoughtEl.textContent += "\n"; thoughtEl.textContent += `◂ ${sum.slice(0,80)}`; }
          const rid = evt.data.result_id;
          if (rid) renderResultTable(tableEl, rid);
        }
        else if (evt.type === "done") finish(evt.data.answer || "");
        else if (evt.type === "cancelled") {
          stopTyper();
          if (!finalText) bubble.textContent = "（已停止）";
          bubble.className = "msg system";
        }
        else if (evt.type === "clarification_needed") {
          stopTyper();
          bubble.remove();
          addMsg("🤔 需要补充：" + evt.data.question, "clarify");
        } else if (evt.type === "correction") {
          addMsg("已纠正：" + evt.data.original + " → " + evt.data.normalized, "system");
        } else if (evt.type === "error") {
          stopTyper();
          bubble.textContent = "⚠ " + (evt.data.message || "出错");
          bubble.className = "msg err";
        }
      }
    }
    if (!got) { stopTyper(); bubble.textContent = "（无回复）"; }
    // done 后：有 SQL 就在答案下挂折叠按钮（默认隐藏，点开看 SQL）
    if (sqls.length) appendSqlToggle(bubble, sqls);
  } catch (e) {
    stopTyper();
    // 用户主动取消（AbortController）不显示报错，cancelled 事件已处理 UI
    if (e.name === "AbortError") { /* 已被 doStop 处理，静默 */ }
    else { bubble.textContent = "⚠ 请求失败：" + e.message; bubble.className = "msg err"; }
  }
  stopBtn.hidden = true;
  sendBtn.disabled = false;
}

// 极简 markdown → HTML：渲染 done 的定稿答案（answer_delta 打字期仍用 textContent 纯文本快渲染）。
// ponytail: 自己写最小渲染器覆盖项目实际用的 md 子集（列表/粗体/行内码/段落），
// 不引 marked.js——内网单页加 30KB 依赖只为渲染几行答案不划算。
// 只在「定稿/clarification」等信任面渲染（内容来自自家 LLM，非用户跨站输入），转义前置防 XSS。
function renderMarkdown(el, text) {
  if (!text) { el.textContent = ""; return; }
  // 先 HTML 转义防注入
  let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // 行内：`code` 和 **bold**
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // 按行分段：连续同类型列表行合并成一个 ul/ol，连续普通行合并成段落
  const lines = s.split("\n");
  let out = "", para = [], ul = [], ol = [];
  const flushPara = () => { if (para.length) { out += `<p>${para.join("<br>")}</p>`; para = []; } };
  const flushUl = () => { if (ul.length) { out += `<ul><li>${ul.join("</li><li>")}</li></ul>`; ul = []; } };
  const flushOl = () => { if (ol.length) { out += `<ol><li>${ol.join("</li><li>")}</li></ol>`; ol = []; } };
  const flushAll = () => { flushPara(); flushUl(); flushOl(); };
  for (const line of lines) {
    const m1 = line.match(/^\s*-\s+(.*)$/);       // - 项目
    const m2 = line.match(/^\s*\d+\.\s+(.*)$/);    // 1. 项目
    if (m1) { flushPara(); flushOl(); ul.push(m1[1]); }      // 切到 ul 前先收其他类型
    else if (m2) { flushPara(); flushUl(); ol.push(m2[1]); }
    else if (line.trim() === "") { flushAll(); }
    else { flushUl(); flushOl(); para.push(line); }
  }
  flushAll();
  el.innerHTML = out || s;
}

// 在答案气泡下挂折叠 SQL 区：默认隐藏，点按钮展开/收起。
// ponytail: 不引 highlight.js——内网单页加依赖不划算，<pre> 等宽字体够看。
function appendSqlToggle(bubble, sqls) {
  const wrap = document.createElement("div");
  wrap.className = "sql-wrap";
  const btn = document.createElement("button");
  btn.className = "sql-toggle";
  btn.textContent = `查看 SQL（${sqls.length}）`;
  const pre = document.createElement("pre");
  pre.className = "sql-code";
  pre.style.display = "none";
  pre.textContent = sqls.join("\n;\n\n");
  btn.onclick = () => {
    const show = pre.style.display === "none";
    pre.style.display = show ? "block" : "none";
    btn.textContent = show ? `收起 SQL（${sqls.length}）` : `查看 SQL（${sqls.length}）`;
  };
  wrap.append(btn, pre);
  bubble.appendChild(wrap);
}

// 按 result_id 拉全量结果渲染成表格，挂到 table 区。
// ponytail: 行数可能大，前端截前 200 行展示 + 提示总数，超量分页等真需要再加。
async function renderResultTable(el, resultId) {
  try {
    const r = await fetch(`/api/result/${resultId}`);
    if (!r.ok) return;
    const {columns, rows, total} = await r.json();
    if (!columns || !columns.length) return;
    const LIMIT = 200;
    const show = rows.slice(0, LIMIT);
    let html = "<table><thead><tr>";
    for (const c of columns) html += `<th>${esc(c)}</th>`;
    html += "</tr></thead><tbody>";
    for (const row of show) {
      html += "<tr>";
      for (const c of columns) html += `<td>${esc(row[c] ?? "")}</td>`;
      html += "</tr>";
    }
    html += "</tbody></table>";
    if (total > LIMIT) html += `<div style="font-size:12px;color:#888;padding:4px;">共 ${total} 行，前 ${LIMIT} 行预览</div>`;
    el.innerHTML = html;
    el.style.display = "block";
  } catch {}
}

function esc(s) {  // 表格单元格 HTML 转义防注入
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
    pre.style.display = show ? "block" : "none";
    btn.textContent = show ? "隐藏 SQL" : `查看 SQL（${sqls.length}）`;
  };
  wrap.appendChild(btn);
  wrap.appendChild(pre);
  bubble.appendChild(wrap);
}

async function loadDatasources() {
  const r = await fetch("/api/admin/datasources");
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("加载数据源失败: " + (d.detail || r.status)); return; }
  const {datasources} = await r.json();
  const list = document.getElementById("ds-list");
  list.innerHTML = "";
  for (const ds of datasources) {
    const div = document.createElement("div");
    div.className = "ds-item" + (ds.id === selectedDsId ? " selected" : "");
    div.dataset.dsId = ds.id;   // 供 locateTable 用属性选择器定位
    div.innerHTML = `
      <div class="ds-row">
        <span class="ds-toggle">▶</span>
        <b>${ds.name}</b>
        <span class="type-tag">${ds.type}</span>
      </div>
      <div class="ds-actions">
        <button data-act="test">测试</button>
        <button data-act="edit">编辑</button>
        <button data-act="del">删除</button>
      </div>
      <div class="schema-list" style="display:none"></div>`;
    const toggle = div.querySelector(".ds-toggle");
    const schemaList = div.querySelector(".schema-list");

    // 点 ▶/数据源名 → 展开/折叠库列表（首次拉取）。展开逻辑抽到 expandDs 供 locateTable 复用
    div.querySelector(".ds-row").onclick = async (e) => {
      if (e.target.tagName === "BUTTON") return;
      const expanded = toggle.textContent === "▼";
      if (expanded) {
        toggle.textContent = "▶"; schemaList.style.display = "none"; return;
      }
      await expandDs(div, ds);
    };
    div.querySelector('[data-act=test]').onclick = async (e) => {
      e.stopPropagation();
      const rr = await fetch(`/api/admin/datasources/${ds.id}/test`, {method: "POST"});
      if (rr.ok) alert("连接成功");
      else { const d = await rr.json().catch(() => ({})); alert("连接失败: " + (d.detail || rr.status)); }
    };
    div.querySelector('[data-act=edit]').onclick = (e) => { e.stopPropagation(); openDsModal(ds); };
    div.querySelector('[data-act=del]').onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("删除数据源 " + ds.name + "?")) return;
      const rr = await fetch(`/api/admin/datasources/${ds.id}`, {method: "DELETE"});
      if (!rr.ok) { const d = await rr.json().catch(() => ({})); alert("删除失败: " + (d.detail || rr.status)); return; }
      if (selectedDsId === ds.id) resetMidAndRight();
      loadDatasources();
    };
    list.appendChild(div);

    // 已选中的源 → 自动展开库列表
    if (ds.id === selectedDsId) {
      div.querySelector(".ds-row").click();
    }
  }
}

// 展开某个数据源的库列表（首次拉取 + 渲染）。抽出来供 loadDatasources 的 onclick 和
// locateTable 复用——后者需要 await 它确保库列表就绪后再继续选 schema / 拉表。
async function expandDs(div, ds) {
  const toggle = div.querySelector(".ds-toggle");
  const schemaList = div.querySelector(".schema-list");
  toggle.textContent = "▼"; schemaList.style.display = "block";
  if (schemaList.dataset.loaded) return;     // 已拉过，直接展开
  schemaList.innerHTML = '<div class="schema-placeholder">拉取库列表中…</div>';
  try {
    const rr = await fetch(`/api/admin/datasources/${ds.id}/schemas`);
    if (!rr.ok) throw new Error((await rr.json().catch(() => ({})).detail) || rr.status);
    const {schemas} = await rr.json();
    schemaList.dataset.loaded = "1";
    schemaList.dataset.schemas = JSON.stringify(schemas);
    renderSchemaList(schemaList, ds.id, schemas);
  } catch (err) {
    schemaList.innerHTML = `<div class="schema-placeholder" style="color:#c62828">拉取失败: ${err.message}</div>`;
  }
}

// 渲染库列表节点（ds.id 下）：只显示库名，点库加载中栏表清单。
// ponytail: 库节点不再显示表数计数——PG 计数对没同步的库不准（同步过的有/没同步的没，不一致）。
function renderSchemaList(container, dsId, schemas) {
  container.innerHTML = "";
  if (!schemas.length) {
    container.innerHTML = '<div class="schema-placeholder">无可见库（检查权限）</div>';
    return;
  }
  for (const sk of schemas) {
    const item = document.createElement("div");
    item.className = "schema-item" + (dsId === selectedDsId && sk === selectedSchema ? " selected" : "");
    item.dataset.schema = sk;
    item.innerHTML = `<span class="s-name">📁 ${sk}</span>`;
    item.onclick = (e) => {
      e.stopPropagation();
      selectedDsId = dsId;
      selectedSchema = sk;
      selectedTableName = null;
      container.querySelectorAll(".schema-item").forEach(x => x.classList.toggle("selected", x === item));
      // 同级数据源高亮
      document.querySelectorAll(".ds-item").forEach(x => x.classList.remove("selected"));
      item.closest(".ds-item").classList.add("selected");
      loadObjects(dsId, sk);
    };
    container.appendChild(item);
  }
}

    r = await fetch(`/api/admin/datasources/${editingDsId}`, {
      method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  } else {
    if (!pwd) { alert("新建必须填密码"); return; }
    body.password = pwd;
    r = await fetch("/api/admin/datasources", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  }
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("保存失败: " + (d.detail || r.status)); return; }
  document.getElementById("ds-modal").style.display = "none";

};

// 加载某数据源指定库的表清单（实时连业务库拉，左连 PG 显示 enabled/手写注释）
async function loadObjects(dsId, schemaName) {
  const r = await fetch(`/api/admin/datasources/${dsId}/schemas/${encodeURIComponent(schemaName)}/objects`);
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert("加载表失败: " + (d.detail || r.status)); return; }
  const {objects} = await r.json();
  currentTables = objects;
  selectedTableName = null;
  midTitle.textContent = `${schemaName} · ${dsId}`;
  fieldsTitle.textContent = "字段";
  fieldsCount.textContent = "";
  fieldsArea.innerHTML = '<p class="placeholder">点左侧表查看字段</p>';
  if (!objects.length) {
    tablesArea.innerHTML = '<p class="placeholder">该库无可见表</p>';
    return;
  }
  renderTables(objects, tableSearch.value);
}

// 渲染中栏表清单（按当前 tab + 搜索词过滤）
function renderTables(tables, q) {
  const ql = q.trim().toLowerCase();
  const list = tables
    .filter(t => t.kind === currentKind)  // tab 过滤：table / view
    .filter(t => !ql || (t.name + " " + (t.comment || "")).toLowerCase().includes(ql));
  tablesArea.innerHTML = "";
  if (!list.length) {
    tablesArea.innerHTML = `<p class="placeholder">无${currentKind === "view" ? "视图" : "表"}${ql ? "匹配" : ""}</p>`;
    return;
  }
  for (const t of list) {
    const row = document.createElement("div");
    row.className = "table-row" + (t.name === selectedTableName ? " selected" : "");
    const icon = t.kind === "view" ? "👁" : "📋";
    row.innerHTML = `
      <label class="checkbox"><input type="checkbox" ${t.enabled ? "checked" : ""}></label>
      <span class="icon">${icon}</span>
      <b class="tname">${t.name}</b>
      <span class="cmt">${t.comment || ""}</span>
      <span class="save-tag"></span>`;
    const cb = row.querySelector("input");
    const tag = row.querySelector(".save-tag");
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = async () => {
      // PG 有 id 直接更新；没 id（业务库新表）走 upsert by ds+schema+table
      const url = t.id
        ? `/api/admin/metadata/tables/${t.id}`
        : "/api/admin/metadata/tables/0";
      const body = t.id
        ? {enabled: cb.checked}
        : {datasource_id: selectedDsId, schema_name: selectedSchema,
           table_name: t.name, kind: t.kind, comment: t.comment, enabled: cb.checked};
      const rr = await fetch(url, {
        method: "PUT", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)});
      if (rr.ok) {
        const d = await rr.json();
        if (d.id) t.id = d.id;          // upsert 新建后回写 id，下次直接更新
        t.enabled = cb.checked;
        tag.textContent = "✓ 已保存";
        setTimeout(() => tag.textContent = "", 600);
      } else {
        cb.checked = !cb.checked;
        const d = await rr.json().catch(() => ({}));
        alert("保存失败: " + (d.detail || rr.status));
      }
    };
    row.onclick = (e) => {
      if (e.target === cb) return;
      loadFields(t);
    };
    tablesArea.appendChild(row);
  }
}

// 点表行：右栏独立字段表（懒加载 + 缓存到 t._cols，二次点不重拉）
async function loadFields(t) {
  selectedTableName = t.name;
  renderTables(currentTables, tableSearch.value);   // 重渲染以更新选中高亮
  fieldsTitle.textContent = `字段：${t.name}`;
  fieldsCount.textContent = "";
  fieldsArea.innerHTML = '<p class="placeholder">加载字段中…</p>';
  try {
    if (!t._cols) {
      // PG 有 id 走老端点；没 id（业务库表未进 PG）走 by-key 端点实时拉
      const url = t.id
        ? `/api/admin/metadata/tables/${t.id}/columns`
        : `/api/admin/datasources/${selectedDsId}/schemas/${encodeURIComponent(selectedSchema)}/tables/${encodeURIComponent(t.name)}/columns`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      t._cols = (await r.json()).columns;
    }
    fieldsCount.textContent = `共 ${t._cols.length} 个`;
    if (!t._cols.length) {
      fieldsArea.innerHTML = '<p class="placeholder">无字段</p>';
      return;
    }
    fieldsArea.innerHTML = "<table class='field-table'>" +
      "<thead><tr><th class='col-name'>字段</th><th class='col-type'>类型</th><th>注释</th></tr></thead><tbody>" +
      t._cols.map(c => `<tr><td class="col-name">${c.name}</td><td class="col-type">${c.type || ""}</td><td>${c.comment || ""}</td></tr>`).join("") +
      "</tbody></table>";
  } catch (e) {
    fieldsArea.innerHTML = `<p class="placeholder err">加载字段失败: ${e.message}</p>`;
  }
}

// 从「总览」点表名 → 关 modal + 切配置页 + 自动展开 ds→库 + 高亮表行 + 右栏加载字段。
// 全程 await（不靠 .click() 副作用），避免异步竞态。dsId/schema/tableName 三元组由调用方传入。
async function locateTable(dsId, schema, tableName) {
  document.getElementById("dash-modal").style.display = "none";   // 先关 modal
  selectedDsId = dsId;
  selectedSchema = schema;
  selectedTableName = tableName;
  showTab("config");                                              // 切 tab（会 loadDatasources）
  // 等 ds 树渲染完（showTab 内 loadDatasources 是异步的，但它只渲染树，不展开目标源）
  // 用 requestAnimationFrame + 轮询等 ds-list 出现目标 ds 的节点
  const div = await waitForDsRow(dsId);
  if (!div) { alert("找不到数据源 #" + dsId); return; }
  await expandDs(div, {id: dsId});                                // 展开 + 拉库列表
  // 选中目标 schema 节点（renderSchemaList 渲染好后程序化选中）
  const schemaItem = div.querySelector(`.schema-item[data-schema="${cssEscape(schema)}"]`);
  if (schemaItem) {
    div.querySelectorAll(".schema-item").forEach(x => x.classList.toggle("selected", x === schemaItem));
    document.querySelectorAll(".ds-item").forEach(x => x.classList.remove("selected"));
    div.classList.add("selected");
  }
  await loadObjects(dsId, schema);                                // 拉中栏表清单
  // 找目标表：自动切 kind tab（表/视图）+ 高亮 + 右栏加载字段 + 滚到可见区
  const t = currentTables.find(x => x.name === tableName);
  if (!t) { alert(`库 ${schema} 下找不到表 ${tableName}`); return; }
  currentKind = t.kind;                                           // 视图自动切到「视图」tab
  // 同步 kind-tab 按钮高亮（renderTables 只按 currentKind 过滤，不切按钮态）
  document.querySelectorAll(".kind-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.kind === currentKind));
  await loadFields(t);                                            // 右栏加载字段 + renderTables 高亮
  // 高亮行滚到可见区
  const row = tablesArea.querySelector(".table-row.selected");
  if (row) row.scrollIntoView({block: "center", behavior: "smooth"});
}

// 等待 ds-list 里某 ds 的 .ds-item 节点出现（loadDatasources 异步渲染，需轮询）。
// 超时（3s）返回 null。
function waitForDsRow(dsId) {
  return new Promise(resolve => {
    const t0 = Date.now();
    (function check() {
      const div = document.querySelector(`#ds-list .ds-item[data-ds-id="${dsId}"]`);
      if (div) return resolve(div);
      if (Date.now() - t0 > 3000) return resolve(null);
      setTimeout(check, 30);
    })();
  });
}

// CSS.escape 兜底（转义 schema/table 里的特殊字符用于属性选择器）
function cssEscape(s) {
  return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&");
}

// HTML 属性值转义（data-* 写入时防引号注入）
function attrEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;")
                  .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ===== Dashboard 总览：所有数据源 × 库分组 × 勾选表 =====
document.getElementById("btn-dashboard").onclick = async () => {
  const modal = document.getElementById("dash-modal");
  const content = document.getElementById("dash-content");
  content.innerHTML = '<p class="placeholder">加载中…</p>';
  modal.style.display = "flex";
  try {
    const r = await fetch("/api/admin/dashboard");
    if (!r.ok) throw new Error((await r.json().catch(() => ({})).detail) || r.status);
    const {datasources} = await r.json();
    if (!datasources.length) {
      content.innerHTML = '<p class="placeholder">无数据源</p>';
      return;
    }
    content.innerHTML = datasources.map(ds => {
      const schemaHtml = (ds.schemas || []).map(sk => {
        const tbls = sk.tables || [];
        const enabled = tbls.filter(t => t.enabled);
        return `<div class="dash-schema">
          <div class="dash-schema-head">📁 ${sk.schema_name} · 总 ${tbls.length} / 勾选 ${enabled.length}</div>
          ${(enabled.length ? enabled : tbls.slice(0, 3)).map(t =>
            `<div class="dash-table ${t.enabled ? "enabled" : ""}"
                 data-ds="${ds.id}" data-schema="${attrEscape(sk.schema_name)}"
                 data-table="${attrEscape(t.table_name)}" title="点击跳转到此表">
               <span class="icon">${t.kind === "view" ? "👁" : "📋"}</span>
               <span>${t.table_name}</span>
               <span class="cmt" style="color:#999;font-size:11px">${t.table_comment || ""}</span>
               ${t.enabled ? '<span class="check">✓</span>' : ""}
               <span class="goto-tag">跳转 ↗</span>
             </div>`).join("")}
        </div>`;
      }).join("");
      return `<div class="dash-ds">
        <div class="dash-ds-head">
          🗄 ${ds.name}
          <span class="tag">${ds.type}</span>
          <span class="tag">${ds.host}:${ds.port}</span>
        </div>
        ${schemaHtml || '<div class="schema-placeholder">未同步任何库</div>'}
      </div>`;
    }).join("");
  } catch (e) {
    content.innerHTML = `<p class="placeholder err">加载失败: ${e.message}</p>`;
  }
};
document.getElementById("dash-close").onclick = () => document.getElementById("dash-modal").style.display = "none";

// 事件委托：点 dash-content 里的 .dash-table → 跳转到配置页该表
// （dashboard 用字符串拼 HTML，用 data-* + 委托避免内联 onclick 的引号注入风险）
document.getElementById("dash-content").addEventListener("click", (e) => {
  const row = e.target.closest(".dash-table");
  if (!row) return;
  const {ds, schema, table} = row.dataset;
  if (ds && schema && table) locateTable(Number(ds), schema, table);
});

// 页面启动：拉会话列表（不自动建会话，用户发首条消息时 ensureSession 才建）
refreshSessionList();
// 发送后刷新会话列表（首问填标题后侧边栏即显示标题）
const _origOnSend = onSend;
</script>
